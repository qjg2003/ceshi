<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ceshi · GitHub 网页测试</title>
<style>
:root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 18% 18%,#d9f5df 0,transparent 38%),radial-gradient(circle at 85% 82%,#e7f7ce 0,transparent 34%),linear-gradient(135deg,#f5fbf5,#edf7ec);color:#203b2b;padding:20px}
.card{width:min(100%,520px);border:1px solid #d5e9d5;border-radius:26px;padding:44px 35px;text-align:center;background:#ffffffd9;box-shadow:0 24px 70px #315a3518;backdrop-filter:blur(12px)}
.tag{display:inline-block;padding:7px 13px;background:#e8f7e9;border:1px solid #c6e8c9;color:#347446;border-radius:99px;font-size:13px}
h1{font-size:clamp(28px,6vw,40px);margin:24px 0 12px;color:#234a32}
p{color:#607568;line-height:1.8}
.count{font-size:60px;font-weight:800;margin:26px 0 6px;font-variant-numeric:tabular-nums;color:#3c8d56}
button{cursor:pointer;background:#75c889;color:#123a20;border:0;border-radius:14px;padding:14px 30px;font-weight:800;font-size:17px;transition:transform .15s,background .15s,box-shadow .15s;box-shadow:0 8px 20px #63b87930}
button:hover{background:#8ed99d;transform:translateY(-2px);box-shadow:0 10px 24px #63b87945}
button:active{transform:translateY(1px)}
button:focus-visible{outline:3px solid #4e9e62;outline-offset:3px}
footer{margin-top:26px;font-size:13px;color:#829487}
</style>
</head>
<body>
<main class="card">
<div class="tag">✓ GitHub 连接测试</div>
<h1>你好，网页运行成功！</h1>
<p>这是 ChatGPT 为 <strong>qjg2003/ceshi</strong> 创建的第一个测试网页。<br>点击按钮，检查交互功能是否正常。</p>
<div class="count" id="count">0</div>
<button id="clickMe" type="button">点我 +1</button>
<footer>纯 HTML + CSS + JavaScript · 无需安装依赖</footer>
</main>
<script>
let count=0;
document.getElementById("clickMe").addEventListener("click",()=>{
document.getElementById("count").textContent=String(++count);
});
</script>
</body></html>
